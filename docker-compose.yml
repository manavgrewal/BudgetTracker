services:
  budget-tracker:
    build: .
    image: budget-tracker:latest
    container_name: budget-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Optional. If unset (or blank), the app generates one itself on first boot at
      # data/secret.key and reuses it from then on — see the README. Set SECRET_KEY in .env
      # only if you want to manage the key yourself; a value set here always wins.
      SECRET_KEY: ${SECRET_KEY:-}
      # Turn on ONLY behind a TLS-terminating reverse proxy you control.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TZ: ${TZ:-America/Toronto}
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # Container hardening (spec section 6).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
