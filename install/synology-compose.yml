# Budget Tracker — paste this into Container Manager -> Project -> Create.
#
# ZERO-CONFIG: nothing below needs editing to start. The app generates its own key on first
# boot at data/secret.key and reuses it from then on. Want to manage the key yourself instead
# (e.g. to reuse the same one across a rebuild)? Uncomment the SECRET_KEY line below and set
# it to a random string of at least 32 bytes — see docs/INSTALL-SYNOLOGY.md step 4 for how to
# generate one without a terminal.
#
# UPDATING FROM AN OLDER COMPOSE with an absolute-path "volumes:" line: move
# your existing data folder into the project folder (or keep your old
# absolute-path line) before pasting this in, or the app boots empty against
# a fresh ./data.
services:
  budget-tracker:
    # Default: build the image from the uploaded source (see step 5 below).
    # Option B (loaded a prebuilt image instead, e.g. after an out-of-memory
    # build): comment out the "build: ." line — "image:" below already names
    # the tag to run, so nothing else needs to change.
    build: .
    image: budget-tracker:latest
    container_name: budget-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # SECRET_KEY: "set-your-own-if-you-prefer"
      TRUST_PROXY: "0"
      TZ: "America/Toronto"
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      # Relative to this compose file's folder (the Container Manager project
      # path) — works on any volume, /volume1 or otherwise.
      - ./data:/data
    # Container hardening — identical to the main docker-compose.yml.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
